input:
  path: data/raw/presales_data_sample (1).csv
  id_column: null
  name_column: input_company_name
  country_column: input_main_country

candidates:
  max_candidates: 5
  name_pattern: "cand{n}_name"
  country_pattern: "cand{n}_country"
  address_pattern: "cand{n}_address"
  domain_pattern: "cand{n}_domain"
  id_pattern: "cand{n}_id"

thresholds:
  accept: 0.70
  maybe: 0.50
  country_bonus: 0.05

normalization:
  lower: true
  strip_punct: true
  remove_legal_suffixes: true
  legal_suffixes:
    - srl
    - sa
    - ltd
    - limited
    - inc
    - gmbh
    - spa
    - sas
    - aps
    - as
    - a/s
    - ab
    - oy
    - nv
    - bv
    - plc
    - llc
    - co
    - co.

features:
  enrichment: false
  esg: false
  procurement_segments: false

