groups:
- name: api_alerts
  rules:
  - alert: HighApiErrorRate
    expr: |
      (
        sum(rate(ecom_requests_total{status_code=~"5.."}[5m]))
        /
        sum(rate(ecom_requests_total[5m]))
      ) * 100 > 1
    for: 5m
    labels:
      severity: critical
      team: api
    annotations:
      summary: High API error rate (> 1% 5xx)
      description: '{{ printf "%.2f" $value }}% of requests are failing with 5xx errors'

  - alert: HighApiLatency
    expr: |
      histogram_quantile(0.95,
        sum by (le) (rate(ecom_request_latency_ms_bucket[5m]))
      ) > 250
    for: 5m
    labels:
      severity: warning
      team: api
    annotations:
      summary: High API latency (p95 > 250ms)
      description: 'P95 latency is {{ printf "%.2f" $value }}ms'

- name: etl_alerts
  rules:
  - alert: EtlJobFailure
    expr: etl_job_status{status="failed"} > 0
    for: 5m
    labels:
      severity: critical
      team: data
    annotations:
      summary: ETL job failure
      description: 'Job {{ $labels.job_name }} has failed'

  - alert: DataFreshnessSLO
    expr: |
      time() - max(etl_job_last_success_timestamp) > 1800
    for: 5m
    labels:
      severity: warning
      team: data
    annotations:
      summary: Data freshness SLO breach
      description: 'Data is {{ printf "%.0f" $value }} seconds stale'

- name: kafka_alerts
  rules:
  - alert: HighKafkaLag
    expr: |
      avg_over_time(ecom_kafka_consumer_lag[5m]) > 500
    for: 5m
    labels:
      severity: warning
      team: streaming
    annotations:
      summary: High Kafka consumer lag
      description: 'Consumer {{ $labels.consumer_group }} lag is {{ printf "%.0f" $value }} messages'

  - alert: KafkaConsumerStuck
    expr: |
      changes(ecom_kafka_consumer_lag[15m]) == 0 and ecom_kafka_consumer_lag > 0
    for: 5m
    labels:
      severity: critical
      team: streaming
    annotations:
      summary: Kafka consumer stuck
      description: 'Consumer {{ $labels.consumer_group }} lag is not changing'

- name: cache_alerts
  rules:
  - alert: LowCacheHitRate
    expr: |
      (
        rate(ecom_cache_hits_total[5m])
        /
        rate(ecom_cache_requests_total[5m])
      ) < 0.8
    for: 10m
    labels:
      severity: warning
      team: api
    annotations:
      summary: Low cache hit rate (< 80%)
      description: 'Cache hit rate is {{ printf "%.1f" $value }}%'

  - alert: HighCacheInvalidations
    expr: |
      rate(ecom_cache_invalidations_total[5m]) > 100
    for: 5m
    labels:
      severity: warning
      team: api
    annotations:
      summary: High cache invalidation rate
      description: '{{ printf "%.0f" $value }} cache invalidations/sec'
