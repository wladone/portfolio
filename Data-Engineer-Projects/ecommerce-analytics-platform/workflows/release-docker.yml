name: Release Docker Images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  publish:
    name: Build & Publish Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (backend)
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backend
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref_name, 'v') }}

      - name: Extract metadata (etl)
        id: meta_etl
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/etl
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref_name, 'v') }}

      - name: Extract metadata (ml)
        id: meta_ml
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ml
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref_name, 'v') }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}

      - name: Build & push etl
        uses: docker/build-push-action@v5
        with:
          context: .
          file: etl/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta_etl.outputs.tags }}
          labels: ${{ steps.meta_etl.outputs.labels }}

      - name: Build & push ml
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ml/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta_ml.outputs.tags }}
          labels: ${{ steps.meta_ml.outputs.labels }}
